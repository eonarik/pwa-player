name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install server dependencies (for tests)
        run: cd server && yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test:unit --run

      - name: Build frontend
        run: yarn build
        env:
          GIT_HASH: ${{ github.sha }}

      # 1. Копируем dist (фронтенд)
      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'dist/*'
          target: '/var/www/cuei-player/pwa-player/dist/'
          strip_components: 1
          rm: true

      # 2. Копируем только папку server (бэкенд)
      - name: Copy server code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'server/*'
          target: '/var/www/cuei-player/pwa-player/server/'
          strip_components: 1
          overwrite: true

      # 3. Устанавливаем зависимости и перезапускаем PM2
      - name: Deploy backend and reload PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/cuei-player/pwa-player/server
            export YARN_CACHE_FOLDER=/tmp/yarn-cache
            yarn install --frozen-lockfile --production
            pm2 delete cuei-backend || true
            pm2 start src/index.mjs --name cuei-backend
            pm2 save
            rm -rf /tmp/yarn-cache
