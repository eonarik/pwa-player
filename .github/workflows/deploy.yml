name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install server dependencies (for tests)
        run: cd server && yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test:unit --run

      - name: Build frontend
        run: yarn build
        env:
          GIT_HASH: ${{ github.sha }}

      # 1. Статика фронтенда
      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'dist/*'
          target: '/var/www/cuei-player/pwa-player/dist/'
          strip_components: 1
          rm: true

      # 2. Исходники бэкенда + Dockerfile + compose
      - name: Copy server code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'server/*'
          target: '/var/www/cuei-player/pwa-player/server/'
          strip_components: 1
          overwrite: true

      - name: Copy Docker files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'Dockerfile,docker-compose.yml'
          target: '/var/www/cuei-player/pwa-player/'
          overwrite: true

      # 3. .env из секрета
      - name: Write .env on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cat > /var/www/cuei-player/pwa-player/server/.env <<'EOF'
            ${{ secrets.SERVER_ENV_FILE }}
            EOF
            chmod 600 /var/www/cuei-player/pwa-player/server/.env

      # 4. Пересборка и запуск бэкенда
      - name: Deploy backend with Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/cuei-player/pwa-player
            docker compose down
            docker compose up -d --build
            docker image prune -f