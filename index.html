<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CUEI Media Player</title>
  </head>
  <body>
    <svg width="0" height="0" class="absolute" aria-hidden="true" focusable="false">
      <defs>
        <!-- Градиенты для ретро -->
        <linearGradient id="brass-gradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fce68a" />
          <stop offset="50%" stop-color="#d4af37" />
          <stop offset="100%" stop-color="#8b6914" />
        </linearGradient>
        <linearGradient id="emerald-gradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6effb0" />
          <stop offset="100%" stop-color="#1b8a4c" />
        </linearGradient>

        <!-- Градиенты для киберпанка -->
        <linearGradient id="neon-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00f0ff" />
          <stop offset="100%" stop-color="#7df9ff" />
        </linearGradient>
        <linearGradient id="magenta-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff007f" />
          <stop offset="100%" stop-color="#ff7fbf" />
        </linearGradient>

        <!-- Градиенты для Барби -->
        <linearGradient id="barbie-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f9a8d4" />
          <stop offset="100%" stop-color="#db2777" />
        </linearGradient>
        <linearGradient id="barbie-gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="100%" stop-color="#fcd34d" />
        </linearGradient>
      </defs>
    </svg>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
